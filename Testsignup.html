<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        :root {
            --bg: #f7f7fb;
            --text: #1f2937;
            --muted: #4b5563;
            --card: #ffffff;
            --primary: #e34b4b;
            --shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
            --radius: 12px;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.5rem;
            text-align: center;
        }
        label {
            display: block;
            font-size: 0.92rem;
            margin: 12px 0 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px; /* Space between inputs */
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            color: #fff;
            background: var(--primary);
            cursor: pointer;
            transition: background 0.3s; /* Smooth transition */
        }
        button:hover {
            background: #c0392b; /* Darken on hover */
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            min-height: 1.2em;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: #111;
            color: #fff;
            padding: 10px 12px;
            text-align: center;
            font-family: monospace;
            font-size: 12px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Create an account</h2>
            <form id="signup-form">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" required>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required>

                <label for="signup-name">Display name (optional)</label>
                <input type="text" id="signup-name">

                <button type="submit" id="signup-btn">Create account</button>
                <div class="status" id="signup-status"></div>
            </form>
        </div>
    </div>
    <div class="banner" id="qp-banner"></div>

    <script>
        // Replace with your real values (do not expose real keys publicly in chat)
        const SUPABASE_URL = 'https://ziltrcaehpshkwganlcy.supabase.co'; // YOUR-PROJECT URL
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppbHRyY2FlaHBzaGt3Z2FubGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ4NjM0NzMsImV4cCI6MjA3MDQzOTQ3M30.8CLBXrknu3kea7OMdJKOBSNayXBOu3lJFu_H4PqI0vg'; // YOUR-ANON-KEY

        function showBanner(text) {
            const b = document.getElementById('qp-banner');
            if (b) { b.style.display = 'block'; b.textContent = 'Init: ' + text; }
        }

        function initSupabase() {
            if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
                console.warn('Supabase library not loaded yet.');
                showBanner('not ready');
                setTimeout(initSupabase, 150);
                return;
            }
            window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase initialized:', !!window.supabase);
            showBanner('ready');
            if (typeof window.bindSignupHandler === 'function') window.bindSignupHandler();
        }

        // Kick off init after CDN load
        setTimeout(initSupabase, 0);

        (function() {
            window.bindSignupHandler = async function() {
                const form = document.getElementById('signup-form');
                const status = document.getElementById('signup-status');
                const btn = document.getElementById('signup-btn');
                if (!form) return;

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!window.supabase) {
                        alert('Please wait for the Sign Up module to finish initializing. Try again in a moment.');
                        return;
                    }

                    const email = document.getElementById('signup-email').value.trim();
                    const password = document.getElementById('signup-password').value;
                    const name = document.getElementById('signup-name').value.trim();

                    if (!email || !password) {
                        status.textContent = 'Please provide email and password.';
                        return;
                    }

                    btn.disabled = true;
                    btn.textContent = 'Creating account...';
                    status.textContent = '';

                    try {
                        // Primary signup (auth)
                        const { user, session, error } = await window.supabase.auth.signUp(
                            { email, password },
                            { data: { display_name: name || '' } }
                        );

                        if (error) {
                            status.textContent = 'Signup error: ' + (error.message || error);
                        } else if (user) {
                            status.textContent = 'Signup successful. Check email to verify.';
                        } else {
                            status.textContent = 'Signup complete. Please verify email.';
                        }

                        // Seed into your "user" table
                        if (user && user.id) {
                            const tableName = 'users'; // Adjust if needed
                            try {
                                const { data: seed, error: seedError } = await window.supabase
                                    .from(tableName)
                                    .insert([{ id: user.id, email, display_name: name || '' }])
                                    .single();

                                if (seedError) {
                                    status.textContent += ' | Seed error: ' + (seedError.message || seedError);
                                } else {
                                    status.textContent += ' | User row seeded';
                                }
                            } catch (seedCatch) {
                                status.textContent += ' | Seed exception: ' + (seedCatch?.message || seedCatch);
                            }
                        }
                    } catch (err) {
                        status.textContent = 'Signup failed: ' + (err?.message || err);
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Create account';
                    }
                });
            };

            // Bind after load
            window.addEventListener('load', () => {
                if (typeof window.bindSignupHandler === 'function') window.bindSignupHandler();
            });
        })();
    </script>
</body>
</html>
