<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>Uniquity Solutions — Login</title>
 <style>
 :root {
 --bg: #f7f7fb;
 --text: #1f2937;
 --card: #ffffff;
 --primary: #e34b4b;
 --shadow: 0 10px 30px rgba(2,6,23,.15);
 --radius: 12px;
 }
 * { box-sizing: border-box; }
 html, body { height: 100%; margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); }
 .nav { position: sticky; top: 0; z-index: 1100; background: rgba(0,0,0,.04); display:flex; align-items:center; justify-content: space-between; padding: 12px 20px; }
 .brand { display:flex; align-items:center; gap: 8px; font-weight:700; color:#111; }
 .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #fff, #ffd6a3); display:inline-block; }
 .container { width: 100%; max-width: 720px; margin: 0 auto; padding: 40px 16px; }
 .card { background: var(--card); border-radius: var(--radius); border: 1px solid #e5e7eb; padding: 24px; box-shadow: var(--shadow); }
 h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 700; }
 .field { margin: 12px 0; display: block; }
 label { display: block; font-size: 0.9rem; color: #374151; margin-bottom: 6px; }
 input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 1rem; }
 .btn { background: var(--primary); color:white; border:0; padding: 12px 16px; border-radius: 8px; font-weight:700; cursor: pointer; width: 100%; }
 .status { margin-top: 8px; font-size: 0.9rem; color: #374151; }
 #onboardArea { display: none; margin-top: 16px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
 </style>
</head>
<body>
 <nav class="nav" aria-label="Primary">
 <div class="container nav-inner" style="display:flex; align-items:center; gap:12px;">
 <a class="brand" href="https://www.uniquitysolutions.com/index.html" aria-label="Uniquity Solutions Home">
 <span class="brand-mark" aria-hidden="true"></span>
 Uniquity Solutions
 </a>
 <div style="margin-left:auto;">
 <a href="/login.html" aria-current="page" style="margin-right:12px;">Login</a>
 <a href="/signup.html">Sign Up</a>
 </div>
 </div>
 </nav>

 <main class="container" id="appRoot">
 <section class="card" aria-label="Login Card">
 html">Sign Up</a>
 </div>
 </div>
 </nav>

 <main class="container" id="appRoot">
 <section class="card" aria-label="Login Card">
 <h1>Sign In</h1>

 <form id="login-form" autocomplete="username" novalidate>
 <div class="field">
 <label for="login-email">Email</label>
 <input id="login-email" type="email" placeholder="you@example.com" required />
 </div>
 <div class="field">
 <label for="login-password">Password</label>
 <input id="login-password" type="password" placeholder="Your password" required />
 </div>
 <button type="submit" id="login-btn" class="btn" style="text-transform:uppercase;">Sign In</button>
 <div id="login-status" class="status" aria-live="polite" style="display:none;"></div>
 </form>

 <div id="onboardArea" aria-live="polite">
 <strong>Onboarding Required</strong>
 <p>Please complete onboarding to access the dashboard.</p>
 </div>

 <div id="clientGreeting" style="margin-top:12px;"></div>
 </section>
 </main>

 <script type="module">
 // Production: replace these with your real values (safe to hardcode only in prod build)
 const SUPABASE_URL = "https://gifguoyqccozlijrxgcf.supabase.co";
 const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppbHRyY2FlaHBzaGt3Z2FubGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ4NjM0NzMsImV4cCI6MjA3MDQzOTQ3M30.8CLBXrknu3kea7OMdJKOBSNayXBOu3lJFu_H4PqI0vg";

 // Optional: if you want a mock path in dev, keep this flag false in production
 const USE_MOCK = false;

 let sb = null;

 // Initialize Supabase client
 async function initSupabase() {
 if (typeof window !== "undefined") {
 try {
 const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
 sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 console.info("Supabase initialized");
 } catch (err) {
 console.error("Failed to load Supabase JS module:", err);
 if (USE_MOCK) {
 sb = null; // will use mock fallback in login handler
 } else {
 // In production, fail hard to surface config issues early
 alert("Failed to initialize authentication client.");
 }
 }
 }
 }

 // Post-login: fetch profile and gate onboarding
 async function renderPostLogin(user) {
 // user: { id, name, business_id, role, onboarding_complete }
 const name = user?.name || "Client";
 const biz = user?.business_id || "";
 const greetingEl = document.getElementById("clientGreeting");
 if (greetingEl) greetingEl.textContent = `Welcome, ${name}${biz ? ` (Business ID: ${biz})` : ""}!`;

 const onboardPanel = document.getElementById("onboardArea");
 const shouldShowOnboard = (user?.role === "user_connect" || user?.role === "connect_user") && !user?.onboarding_complete;
 if (onboardPanel) onboardPanel.style.display = shouldShowOnboard ? "" : "none";

 // TODO: redirect to your dashboard if needed
 // window.location.href = "dashboard.html";
 }

 // Login handler
 async function handleLogin(e) {
 e.preventDefault();
 const email = document.getElementById("login-email").value.trim();
 const password = document.getElementById("login-password").value;

 const loginStatus = document.getElementById("login-status");
 const loginBtn = document.getElementById("login-btn");
 if (!sb && !USE_MOCK) {
 // If not using mock and SB isn't initialized yet
 loginStatus.textContent = "Initializing authentication client...";
 loginStatus.style.display = "";
 await new Promise(r => setTimeout(r, 200));
 return;
 }

 if (!email || !password) {
 loginStatus.textContent = "Please enter email and password.";
 loginStatus.style.display = "";
 return;
 }

 if (loginBtn) loginBtn.disabled = true;
 loginStatus.textContent = "Signing in…";
 loginStatus.style.display = "";

 try {
 if (sb) {
 const { data: signInData, error: signInError } = await sb.auth.signInWithPassword({ email, password });
 if (signInError) throw new Error(signInError.message || "Login failed");

 const userId = signInData?.user?.id;
 if (!userId) throw new Error("No user returned from auth");

 // Profile lookup
 const { data: profile, error: profileError } = await sb
 .from("profiles")
 .select("name, business_id, role, onboarding_complete")
 .eq("user_id", userId)
 .maybeSingle();

 if (profileError) throw new Error(profileError.message || "Failed to load user profile");

 const currentUser = {
 id: userId,
 name: profile?.name || "",
 business_id: profile?.business_id || "",
 role: profile?.role || "user",
 onboarding_complete: !!profile?.onboarding_complete
 };

 await renderPostLogin(currentUser);
 } else {
 // Mock flow for local dev
 const mockUser = {
 id: "guest",
 name: "Guest",
 business_id: "",
 role: "user_connect",
 onboarding_complete: false
 };
 await renderPostLogin(mockUser);
 }
 } catch (err) {
 console.error("Login error:", err);
 loginStatus.textContent = "Login failed: " + (err?.message || err);
 } finally {
 if (loginBtn) loginBtn.disabled = false;
 }
 }

 // Init
 (async () => {
 await initSupabase();
 const loginForm = document.getElementById("login-form");
 if (loginForm) loginForm.addEventListener("submit", handleLogin);
 })();
 </script>
</body>
</html>
