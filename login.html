
<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Login</title></head>
<body>
  <h1>Login</h1>
  <form id="login-form" autocomplete="username">
    <label>Email: <input id="login-email" type="email" required></label><br/>
    <label>Password: <input id="login-password" type="password" required></label><br/>
    <button type="submit" id="login-btn">Sign In</button>
  </form>
  <div id="login-status"></div>

  <script src="<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>"></script>
  <script>
    const SUPABASE_URL = 'https://gifguoyqccozlijrxgcf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZmd1b3lxY2NvemxpanJ4Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2MTg2MzUsImV4cCI6MjA3MjE5NDYzNX0.gwZnr8fKE7qXuLi8B5Merul3cVAXZ1r6SaWEUoAJWX0';
    const supabase = supabase || window.supabase || (window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const btn = document.getElementById('login-btn');
      const status = document.getElementById('login-status');
      btn.disabled = true;
      status.textContent = '';

      try {
        const { data, user, session, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Optional: fetch extra role/profile data
        // const { data: profile } = await supabase.from('profiles').select('*').eq('user_id', user.id).single();

        // Redirect to client dashboard
        window.location.href = '/dashboard.html';
      } catch (err) {
        status.textContent = 'Login failed: ' + (err?.message || err);
        btn.disabled = false;
      }
    });

    // Optional: handle initial session check
    window.addEventListener('load', () => {
      const user = (supabase.auth.session() || {}).user;
      if (user) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
