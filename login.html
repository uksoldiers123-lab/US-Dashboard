<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f7fb;
      --text: #1f2937;
      --muted: #4b5563;
      --card: #ffffff;
      --primary: #e34b4b;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.92rem;
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px; /* Space between inputs */
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: background 0.3s; /* Smooth transition */
    }
    button:hover {
      background: #c0392b; /* Darken on hover */
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      min-height: 1.2em;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
      display: none; /* Hidden by default */
    }
    /* Navbar styles */
    .nav {
      position: sticky;
      top: 0;
      z-index: 1100;
      background: linear-gradient(to bottom, rgba(150, 163, 177, 0.9), rgba(150, 163, 177, 0.6));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, .15);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .2px;
    }
    .brand-mark {
      width: 28px; 
      height: 28px; 
      border-radius: 8px;
      background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 40%), linear-gradient(135deg, #fbbf24, #e34b4b);
      box-shadow: 0 6px 14px rgba(233, 75, 75, .35);
    }
    .nav-links {
      display: flex; 
      gap: 26px; 
      align-items: center;
    }
    .nav-links a {
      color: #eef2f7; 
      opacity: .9; 
      font-weight: 600; 
      font-size: 14.5px;
    }
    .nav-links a:hover {
      opacity: 1;
    }
    .cta {
      background: var(--primary); 
      color: white; 
      padding: 10px 16px; 
      border-radius: 999px; 
      font-weight: 700; 
      font-size: 14px;
    }
    .menu-btn {
      display: none; 
      border: 0; 
      background: transparent; 
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="nav" aria-label="Primary">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        Uniquity Solutions
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="#services">Services</a>
        <a href="#partners">Partners</a>
        <a href="#careers">Careers</a>
        <div class="dropdown" data-dropdown>
          <button class="drop-toggle" type="button" data-toggle aria-haspopup="true" aria-expanded="false">
            Get Started
            <svg class="drop-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="drop-menu" data-menu role="menu">
            <a href="https://buy.stripe.com/7sYeVcakW9dRbrObHsgw000" role="menuitem">Make a Payment</a>
            <a href="https://www.dashboard.uniquitysolutions.com/signup.html" role="menuitem">Create Account (Merchants)</a>
            <a href="faq.html" role="menuitem">FAQ</a>
            <a href="pricing.html" role="menuitem">Pricing</a>
            <a href="developers.html" role="menuitem">Developers & API</a>
            <a href="integrations.html" role="menuitem">Integrations</a>
            <a href="compliance.html" role="menuitem">Compliance & Security</a>
            <a href="https://www.dashboard.uniquitysolutions.com/login.html" role="menuitem">Login Portal</a>
          </div>
        </div>
        <a href="#contact" class="cta">Contact</a>
      </div>

      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mobileMenu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Init status banner -->
  <div id="qp-banner" class="banner" aria-live="polite" role="status"></div>
  <div class="container">
    <div class="card">
      <h2>Login</h2>
      <form id="login-form" autocomplete="username">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" required />
        <button type="submit" id="login-btn">Sign In</button>
      </form>
      <div class="status" id="login-status"></div>
    </div>
  </div>

  <!-- CDN: Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script>
    const SUPABASE_URL = 'https://gifguoyqccozlijrxgcf.supabase.co'; // Replace with your Supabase URL
    const SUPABASE_ANON_KEY = 'your-anon-key'; // Replace with your Supabase anon key

    function showBanner(text) {
      const b = document.getElementById('qp-banner');
      if (b) { b.style.display = 'block'; b.textContent = 'Init: ' + text; }
    }

    function initSupabase() {
      if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
        console.warn('Supabase library not loaded yet.');
        showBanner('not ready');
        setTimeout(initSupabase, 150);
        return;
      }
      window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Supabase initialized:', !!window.supabase);
      showBanner('ready');
      if (typeof window.bindLoginHandler === 'function') window.bindLoginHandler();
    }

    // Kick off init after CDN load
    setTimeout(initSupabase, 0);

    (function() {
      window.bindLoginHandler = async function() {
        const form = document.getElementById('login-form');
        const status = document.getElementById('login-status');
        const btn = document.getElementById('login-btn');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!window.supabase) {
            alert('Please wait for initialization. Try again in a moment.');
            return;
          }

          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;

          btn.disabled = true;
          btn.textContent = 'Signing in...';
          status.textContent = '';

          try {
            const { data, user, session, error } = await window.supabase.auth.signInWithPassword({ email, password });
            if (error) {
              status.textContent = 'Login error: ' + (error.message || error);
              btn.disabled = false;
              btn.textContent = 'Sign In';
              return;
            }
            const currentUser = user || (data && data.user) || null;
            // Fetch role from users table (id matches auth user id)
            let role = null;
            if (currentUser && currentUser.id) {
              try {
                const { data: userRow } = await window.supabase
                  .from('users')
                  .select('role')
                  .eq('id', currentUser.id)
                  .single();
                if (userRow && userRow.role) role = userRow.role;
              } catch (e) {
                console.warn('Role fetch failed:', e);
              }
            }
            // Decide target: admin -> AdminDashboard.html, otherwise clientdashboard.html
            const target = (role && String(role).toLowerCase() === 'admin')
              ? 'AdminDashboard.html'
              : 'app/client/Testindex.html';
            // Redirect reliably
            status.textContent = 'Login successful. Redirecting...';
            showBanner('redirecting to ' + target);
            setTimeout(() => {
              window.location.href = target;
            }, 250);
          } catch (err) {
            status.textContent = 'Login failed: ' + (err?.message || err);
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        });
      };

      window.addEventListener('load', () => {
        if (typeof window.bindLoginHandler === 'function') window.bindLoginHandler();
      });
    })();
  </script>
</body>
</html>
