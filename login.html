<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7fb;
      --text: #1f2937;
      --muted: #4b5563;
      --card: #ffffff;
      --primary: #e34b4b;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.92rem;
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px; /* Space between inputs */
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: background 0.3s; /* Smooth transition */
    }
    button:hover {
      background: #c0392b; /* Darken on hover */
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      min-height: 1.2em;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
      display: none; /* Hidden by default */
    }
  </style>
  <!-- CDN: Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <div id="qp-banner" class="banner" aria-live="polite" role="status"></div>

  <div class="container">
    <div class="card">
      <h2>Login</h2>
      <form id="login-form" autocomplete="username">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" required />

        <button type="submit" id="login-btn">Sign In</button>
        <div class="status" id="login-status"></div>
      </form>
    </div>
  </div>

  <script>
    // Replace with your real values (do not expose real keys publicly in chat)
    const SUPABASE_URL = 'https://ziltrcaehpshkwganlcy.supabase.co'; // YOUR-PROJECT URL
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppbHRyY2FlaHBzaGt3Z2FubGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ4NjM0NzMsImV4cCI6MjA3MDQzOTQ3M30.8CLBXrknu3kea7OMdJKOBSNayXBOu3lJFu_H4PqI0vg'; // YOUR-ANON-KEY

    function showBanner(text) {
      const b = document.getElementById('qp-banner');
      if (b) { b.style.display = 'block'; b.textContent = 'Init: ' + text; }
    }

    function initSupabase() {
      if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
        console.warn('Supabase library not loaded yet.');
        showBanner('not ready');
        setTimeout(initSupabase, 150);
        return;
      }
      window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Supabase initialized:', !!window.supabase);
      showBanner('ready');
      if (typeof window.bindLoginHandler === 'function') window.bindLoginHandler();
    }

    // Kick off init after CDN load
    setTimeout(initSupabase, 0);

    (function() {
      window.bindLoginHandler = async function() {
        const form = document.getElementById('login-form');
        const status = document.getElementById('login-status');
        const btn = document.getElementById('login-btn');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!window.supabase) {
            alert('Please wait for initialization. Try again in a moment.');
            return;
          }

          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;

          btn.disabled = true;
          btn.textContent = 'Signing in...';
          status.textContent = '';

          try {
            const { data, user, session, error } = await window.supabase.auth.signInWithPassword({ email, password });
            if (error) {
              status.textContent = 'Login error: ' + (error.message || error);
              btn.disabled = false;
              btn.textContent = 'Sign In';
              return;
            }
            const currentUser = user || (data && data.user) || null;
            // Fetch role from users table (id matches auth user id)
            let role = null;
            if (currentUser && currentUser.id) {
              try {
                const { data: userRow } = await window.supabase
                  .from('users')
                  .select('role')
                  .eq('id', currentUser.id)
                  .single();
                if (userRow && userRow.role) role = userRow.role;
              } catch (e) {
                console.warn('Role fetch failed:', e);
              }
            }
            // Decide target: admin -> AdminDashboard.html, otherwise clientdashboard.html
            const target = (role && String(role).toLowerCase() === 'admin')
              ? 'AdminDashboard.html'
              : 'app/client/Testindex.html';
            // Redirect reliably
            status.textContent = 'Login successful. Redirecting...';
            showBanner('redirecting to ' + target);
            setTimeout(() => {
              window.location.href = target;
            }, 250);
          } catch (err) {
            status.textContent = 'Login failed: ' + (err?.message || err);
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        });
      };

      // Bind after load
      window.addEventListener('load', () => {
        if (typeof window.bindLoginHandler === 'function') window.bindLoginHandler();
      });
    })();
  </script>
</body>
</html>
