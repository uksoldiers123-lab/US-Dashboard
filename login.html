<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uniquity Solutions — Login</title>

  <!-- CDN: Supabase JS (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- Fonts and CSS (reuse login/theme CSS tokens) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9" />

  <!-- Runtime config BEFORE your app code -->
  <script src="/env.js" defer></script>
</head>
<body>

  <!-- Navbar with icon + hamburger (hamburger visible on all viewports) -->
  <nav class="nav" aria-label="Primary">
    <div class="container nav-inner">
      <a class="brand" href="index.html" aria-label="Uniquity Solutions Home">
        <span class="brand-mark" aria-hidden="true"></span>
        Uniquity Solutions
      </a>

      <!-- Hamburger (top-left) -->
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mobileMenu" title="Menu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Login / Sign Up in header -->
      <div class="nav-links" aria-label="Header actions">
        <a href="/login.html" aria-current="page">Login</a>
        <a href="/signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Mobile overlay menu (accessible via hamburger) -->
  <div id="mobileMenu" class="mobile-menu" role="dialog" aria-label="Mobile Navigation">
    <div class="menu-label">On this page</div>
    <a href="https://www.uniquitysolutions.com/index.html">Home</a>
    <a href="https://www.uniquitysolutions.com/index.html#services">Services</a>
    <a href="https://www.uniquitysolutions.com/index.html#partners">Partners</a>
    <a href="https://www.uniquitysolutions.com/index.html#careers">Careers</a>
    <a href="https://www.uniquitysolutions.com/index.html#contact" class="cta">Contact</a>
    <div class="menu-label">More pages</div>
    <a href="https://buy.stripe.com/7sYeVcakW9dRbrObHsgw000">Make a Payment</a>
    <a href="https://www.dashboard.uniquitysolutions.com/presignup.html">Create Account (Merchants)</a>
    <a href="https://www.uniquitysolutions.com/faq.html">FAQ</a>
    <a href="https://www.uniquitysolutions.com/pricing.html">Pricing</a>
    <a href="https://www.uniquitysolutions.com/developers.html">Developers & API</a>
    <a href="https://www.uniquitysolutions.com/integrations.html">Integrations</a>
    <a href="https://www.uniquitysolutions.com/compliance.html">Compliance & Security</a>
    <a href="https://www.dashboard.uniquitysolutions.com/login.html">Login Portal</a>
  </div>

  <!-- Sign-up Card is replaced with a Login Card but visuals stay consistent -->
  <div class="container" style="padding: 20px 0 60px;">
    <div class="card" aria-label="Login form">
      <h2 style="text-align:center; margin:0 0 12px;">Sign In</h2>
      <form id="login-form" autocomplete="username" novalidate>
        <label for="login-email" class="label">Email</label>
        <input class="input" type="email" id="login-email" name="email" placeholder="name@example.com" required>

        <label for="login-password" class="label" style="margin-top:6px;">Password</label>
        <input class="input" type="password" id="login-password" name="password" placeholder="Your password" required>

        <button type="submit" id="login-btn" class="btn btn-primary" style="margin-top:12px; width:100%;">Sign In</button>
        <div class="status" id="login-status" aria-live="polite" style="margin-top:8px;"></div>
      </form>
    </div>
  </div>

  <!-- Status banner area (init) -->
  <div id="qp-banner" class="banner" aria-live="polite" role="status" style="display:none;"></div>

  <script>
  // CDN: Supabase JS is already loaded above via script tag
  const SUPABASE_URL = 'https://gifguoyqccozlijrxgcf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZmd1b3lxY2NvemxpanJ4Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2MTg2MzUsImV4cCI6MjA3MjE5NDYzNX0.gwZnr8fKE7qXuLi8B5Merul3cVAXZ1r6SaWEUoAJWX0';

  function showBanner(text) {
    const b = document.getElementById('qp-banner');
    if (b) { b.style.display = 'block'; b.textContent = 'Init: ' + text; }
  }

  function initSupabase() {
    if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
      console.warn('Supabase library not loaded yet.');
      showBanner('not ready');
      setTimeout(initSupabase, 150);
      return;
    }
    window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('Supabase initialized:', !!window.supabase);
    showBanner('ready');
    if (typeof window.bindLoginHandler === 'function') window.bindLoginHandler();
  }

  // Kick off init after CDN load
  setTimeout(initSupabase, 0);

  (function() {
    // Login handler (exactly as requested)
    window.bindLoginHandler = async function() {
      const form = document.getElementById('login-form');
      const status = document.getElementById('login-status');
      const btn = document.getElementById('login-btn');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!window.supabase) {
          alert('Please wait for initialization. Try again in a moment.');
          return;
        }

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        status.textContent = '';

        try {
          const { data, user, session, error } = await window.supabase.auth.signInWithPassword({ email, password });
          if (error) {
            status.textContent = 'Login error: ' + (error.message || error);
            btn.disabled = false;
            btn.textContent = 'Sign In';
            return;
          }

          const currentUser = user || (data && data.user) || null;

          // Fetch role from users table (id matches auth user id)
          let role = null;
          if (currentUser && currentUser.id) {
            try {
              const { data: userRow } = await window.supabase
                .from('users')
                .select('role')
                .eq('id', currentUser.id)
                .single();
              if (userRow && userRow.role) role = userRow.role;
            } catch (e) {
              console.warn('Role fetch failed:', e);
            }
          }

          const target = (role && String(role).toLowerCase() === 'admin')
            ? 'app/admin/adminDashboard.html'
            : 'app/client/index.html';

          status.textContent = 'Login successful. Redirecting...';
          showBanner('redirecting to ' + target);
          setTimeout(() => {
            window.location.href = target;
          }, 250);
        } catch (err) {
          status.textContent = 'Login failed: ' + (err?.message || err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    };
  })();

  // Initialize header menu toggle (optional, keep same behavior as signup)
  (function setupMenu() {
    const btn = document.getElementById('menuBtn');
    const mnu = document.getElementById('mobileMenu');
    if (!btn || !mnu) return;
    btn.addEventListener('click', () => {
      const isOpen = mnu.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(isOpen));
    });
  })();
  </script>
</body>
</html>
