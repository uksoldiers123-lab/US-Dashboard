<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stripe Transactions Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .status-bar { height: 8px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
    .status-fill { height: 100%; width: 0%; background: #2563eb; transition: width 0.25s; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    .badge { padding: 2px 6px; border-radius: 4px; background: #eef2ff; color: #3730a3; }
  </style>
</head>
<body>
  <h1>Stripe Transactions Lookup</h1>

  <div class="status-bar" aria-label="status-bar" title="Status progress">
    <div class="status-fill" id="statusFill"></div>
  </div>

  <div style="margin: 8px 0;">
    <select id="searchMode">
      <option value="id">Transaction ID</option>
      <option value="session">Checkout Session ID</option>
      <option value="payment_intent">Payment Intent</option>
      <option value="customer_email">Customer Email</option>
      <option value="business_id">Business ID</option>
      <option value="invoice">Invoice</option>
      <option value="date">Date (YYYY-MM-DD)</option>
    </select>
    <input id="query" placeholder="Enter search value" />
    <button id="searchBtn">Search</button>
  </div>

  <div id="results"></div>

  <!-- CDN Supabase client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    // Replace with your real values
    const SUPABASE_URL = 'https://gifguoyqccozlijrxgcf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZmd1b3lxY2NvemxpanJ4Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2MTg2MzUsImV4cCI6MjA3MjE5NDYzNX0.gwZnr8fKE7qXuLi8B5Merul3cVAXZ1r6SaWEUoAJWX0';
    const supabase = supabaseCreateClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const searchBtn = document.getElementById('searchBtn');
    const searchMode = document.getElementById('searchMode');
    const queryInput = document.getElementById('query');
    const resultsDiv = document.getElementById('results');
    const statusFill = document.getElementById('statusFill');

    function setStatus(p, text) {
      statusFill.style.width = Math.max(0, Math.min(100, p)) + '%';
    }

    async function runQuery(mode, q) {
      let column;
      switch (mode) {
        case 'id': column = 'id'; break;
        case 'session': column = 'checkout_session_id'; break;
        case 'payment_intent': column = 'stripe_payment_intent'; break;
        case 'customer_email': column = 'customer_email'; break;
        case 'business_id': column = 'business_id'; break;
        case 'invoice': column = 'invoice'; break;
        case 'date': column = 'created_at'; break;
        default: column = 'id';
      }

      if (mode === 'date') {
        // Expect YYYY-MM-DD (no time)
        const d = new Date(q);
        if (isNaN(d)) {
          return { data: [], error: { message: 'Invalid date' } };
        }
        const start = new Date(d);
        start.setHours(0,0,0,0);
        const end = new Date(start);
        end.setDate(end.getDate() + 1);

        const { data, error } = await supabase
          .from('transactions')
          .select('*')
          .gte('created_at', start.toISOString())
          .lt('created_at', end.toISOString())
          .order('created_at', { ascending: false });
        return { data, error };
      } else {
        const { data, error } = await supabase
          .from('transactions')
          .select('*')
          .eq(column, q)
          .order('created_at', { ascending: false });
        return { data, error };
      }
    }

    async function search() {
      const mode = searchMode.value;
      const q = (queryInput.value || '').trim();
      if (!q && mode !== 'date') {
        resultsDiv.innerHTML = '<p>Please enter a search value.</p>';
        return;
      }

      // Init progress
      setStatus(10, 'Starting search...');
      let data = [], error;
      try {
        const res = await runQuery(mode, q);
        data = res.data;
        error = res.error;
      } catch (e) {
        error = e;
      }

      if (error) {
        resultsDiv.innerHTML = `<p style="color:#e11d48;">Error: ${error.message}</p>`;
        setStatus(0);
        return;
      }

      // Render
      if (!data || data.length === 0) {
        resultsDiv.innerHTML = '<p>No results found.</p>';
      } else {
        const header = ['id','stripe_payment_intent','stripe_charge_id','checkout_session_id','amount','currency','status','customer_email','description','business_id','invoice','created_at'];
        let html = '<table><thead><tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
        for (const r of data) {
          html += '<tr>' + header.map(h => `<td>${r[h] ?? ''}</td>`).join('') + '</tr>';
        }
        html += '</tbody></table>';
        resultsDiv.innerHTML = html;
      }

      setStatus(100);
      // reset after a moment
      setTimeout(() => setStatus(0), 800);
    }

    searchBtn.addEventListener('click', search);
  </script>
</body>
</html>
