<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stripe Transactions Lookup (Tester)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #2563eb;
      --green: #16a34a;
      --red: #e11d48;
      --border: #e5e7eb;
      --chip: #eef2ff;
      --chipText: #3730a3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto; background: var(--bg); color: var(--text); }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.25rem; margin: 0; }
    .init-bar-bottom { height: 8px; border-radius: 4px; background: #e5e7eb; overflow: hidden; margin: 12px 0 0; }
    .init-fill-bottom { height: 100%; width: 0%; background: linear-gradient(90deg, #1e40af, #2563eb); transition: width 0.25s ease; }
    .status-bar { height: 12px; border-radius: 6px; background: #e5e7eb; overflow: hidden; margin: 6px 0; }
    .status-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s ease; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.6rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; }
    button { padding: 0.65rem 1rem; border-radius: 6px; border: 1px solid #0b5ed7; background: #1e6af7; color: #fff; cursor: pointer; font-weight: 600; }
    button.secondary { background: #fff; color: #374151; border: 1px solid var(--border); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid var(--border); padding: 8px 8px; text-align: left; font-size: 0.92rem; }
    th { background: #f8fafc; position: sticky; top: 160px; z-index: 1; }
    tfoot td { font-weight: 600; }
    .section-title { font-weight: 700; margin: 8px 0 6px; font-size: 1rem; }
    .results-area { min-height: 180px; padding: 6px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; background: #eef2ff; color: #3730a3; }
  </style>
</head>
<body>
  <header>
    <div class="container" style="display:flex; align-items: center; justify-content: space-between;">
      <h1>Stripe Transactions Lookup (Tester)</h1>
      <span class="badge" id="statusLabel" aria-live="polite">Idle</span>
    </div>
    <div class="container" aria-label="status-bar" style="padding-top:0;">
      <div class="init-bar-bottom" aria-label="init-progress-bar-bottom" title="Initialization progress (bottom)">
        <div class="init-fill-bottom" id="initFillBottom"></div>
      </div>
      <div class="status-bar" id="statusBar" title="Status progress" style="margin-top:6px;">
        <div class="status-fill" id="statusFill"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- TEST INPUTS -->
    <section class="card" aria-label="search-form">
      <div class="grid" style="align-items: end;">
        <div>
          <label for="searchMode">Search by</label>
          <select id="searchMode" aria-label="Search mode">
            <option value="id">Transaction ID</option>
            <option value="session">Checkout Session ID</option>
            <option value="payment_intent">Payment Intent</option>
            <option value="customer_email">Customer Email</option>
            <option value="business_id">Business ID</option>
            <option value="invoice">Invoice</option>
            <option value="date">Date (YYYY-MM-DD)</option>
          </select>
        </div>
        <div>
          <label for="query">Query</label>
          <input id="query" placeholder="Enter your search value" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="searchBtn" type="button">Search</button>
        </div>
      </div>
      <div class="note" style="margin-top: 8px;">
        Tip: You can search across all time. Dates are matched against created_at.
      </div>
    </section>

    <!-- TEST RESULTS SECTION -->
    <section class="card" aria-label="results-section" id="resultsSection" style="margin-top:12px;">
      <div class="section-title">Test Results</div>
      <div id="results" class="results-area"></div>
      <div style="margin-top: 12px; text-align: right;">
        <button id="resetBtn" class="secondary" type="button">Reset</button>
        <button id="statusBtn" class="secondary" type="button" style="margin-left:8px;">Status</button>
      </div>
    </section>

    <!-- TEST ENDPOINT / READ INTEGRATION -->
    <p class="note" style="margin-top:8px;">
      This tester page hits the read endpoint below. For tester mode you can also trigger the webhook directly if desired.
    </p>
  </main>

  <!-- CDN Supabase client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/supabase.min.js"></script>

  <script>
    // TEST VALUES (put your real testing values here)
    const SUPABASE_URL = 'https://gifguoyqccozlijrxgcf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZmd1b3lxY2NvemxpanJ4Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2MTg2MzUsImV4cCI6MjA3MjE5NDYzNX0.gwZnr8fKE7qXuLi8B5Merul3cVAXZ1r6SaWEUoAJWX0'; // Put your tester anon key here
    const READ_ENDPOINT = 'https://gifguoyqccozlijrxgcf.supabase.co/functions/v1/transactions-read';
    // Optional: TEST webhook URL (you can trigger it if you have a tester flow)
    const TEST_WEBHOOK_URL = 'https://gifguoyqccozlijrxgcf.supabase.co/functions/v1/stripe-webhook';

    const supabase = supabaseCreateClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusBtn = document.getElementById('statusBtn');
    const initFillBottom = document.getElementById('initFillBottom');
    const initBarBottom = document.querySelector('[aria-label="init-progress-bar-bottom"]');
    const statusFill = document.getElementById('statusFill');
    const queryInput = document.getElementById('query');
    const searchMode = document.getElementById('searchMode');
    const resultsDiv = document.getElementById('results');
    const statusLabel = document.getElementById('statusLabel');
    const statusBar = document.getElementById('statusBar');

    function setInitProgressBottom(p) {
      initFillBottom.style.width = Math.max(0, Math.min(100, p)) + '%';
    }

    function setStatus(percent, text) {
      statusFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
      statusLabel.textContent = text || (percent >= 100 ? 'Done' : 'Loading');
    }

    async function runRead(mode, value) {
      const url = new URL(READ_ENDPOINT);
      url.searchParams.set('mode', mode);
      if (value) url.searchParams.set('value', value);
      const res = await fetch(url.toString(), { method: 'GET', headers: { 'Content-Type': 'application/json' } });
      if (!res.ok) {
        const err = await res.text();
        throw new Error('Read API error: ' + err);
      }
      const json = await res.json();
      return json.data ?? [];
    }

    function renderTable(rows) {
      if (!rows || rows.length === 0) {
        resultsDiv.innerHTML = '<p>No results found.</p>';
        return;
      }
      const header = ['id','stripe_payment_intent','stripe_charge_id','checkout_session_id','amount','currency','status','customer_email','description','business_id','invoice','created_at'];
      let html = '<table><thead><tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      for (const r of rows) {
        html += '<tr>' + header.map(h => `<td>${r[h] ?? ''}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table>';
      resultsDiv.innerHTML = html;
    }

    async function search() {
      const mode = (searchMode.value || 'id').toLowerCase();
      const value = (queryInput.value || '').trim();

      // All-time by default if tester wants: require a value for non-date
      if (!value && mode !== 'date') {
        resultsDiv.innerHTML = '<p>Please enter a search value.</p>';
        return;
      }

      setInitProgressBottom(0);
      setStatus(10, 'Fetching data...');

      try {
        const data = await runRead(mode, value);
        renderTable(data);
        setStatus(100, 'Done');
      } catch (e) {
        resultsDiv.innerHTML = `<p style="color: #e11d48;">Error: ${e.message}</p>`;
        setStatus(0, 'Idle');
      }

      // bottom init finish
      setInitProgressBottom(100);
      setTimeout(() => setInitProgressBottom(0), 800);
      // reset status after a moment
      setTimeout(() => setStatus(0, 'Idle'), 900);
    }

    resetBtn.addEventListener('click', async () => {
      queryInput.value = '';
      resultsDiv.innerHTML = '<p>Enter a search value and press Search to see results.</p>';
      setStatus(0, 'Idle');
      setInitProgressBottom(0);
    });

    searchBtn.addEventListener('click', async () => {
      await search();
    });

    statusBtn.addEventListener('click', () => {
      setStatus(0, 'Idle');
      setInitProgressBottom(0);
    });

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      resultsDiv.innerHTML = '<p>Enter a search value and press Search to see results.</p>';
      setStatus(0, 'Idle');
      setInitProgressBottom(0);
    });
  </script>
</body>
</html>
