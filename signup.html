<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7fb;
      --text: #1f2937;
      --muted: #4b5563;
      --card: #ffffff;
      --primary: #e34b4b;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text); background: var(--bg);
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
    }
    header .brand { display: flex; align-items: center; gap: 12px; }
    header .brand .logo { width: 28px; height: 28px; background: var(--primary); border-radius: 6px; }
    header nav { margin-left: auto; display: flex; gap: 14px; }
    header nav a { text-decoration: none; color: var(--text); font-weight: 500; }

    .container { max-width: 520px; margin: 0 auto; padding: 20px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-top: 20px; }
    h2 { margin: 0 0 12px; font-size: 1.5rem; text-align: center; }

    fieldset { border: 0; padding: 0; margin: 0 0 12px; }
    legend { font-weight: 600; margin-bottom: 6px; }

    label { display: block; font-size: 0.92rem; margin: 12px 0 6px; }
    input, select { width: 100%; padding: 12px; font-size: 1rem;
      border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .note { font-size: 0.85rem; color: var(--muted); }

    button { width: 100%; padding: 14px; font-size: 1rem;
      border-radius: 8px; border: none; color: #fff; background: var(--primary);
      cursor: pointer; transition: background 0.3s; }
    button:hover { background: #c0392b; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status { margin-top: 12px; min-height: 1.2em; font-size: 0.95rem; color: var(--muted); }

    .banner { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      background: #111; color: #fff; padding: 10px 12px; text-align: center;
      font-family: monospace; font-size: 12px; display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <!-- Header matching login -->
  <header>
    <div class="brand">
      <div class="logo" aria-label="Logo"></div>
      <strong>My App</strong>
    </div>
    <nav aria-label="Main navigation">
      <a href="/login.html">Login</a>
      <a href="/signup.html" aria-current="page">Sign Up</a>
    </nav>
  </header>

  <div id="qp-banner" class="banner" aria-live="polite" role="status"></div>

  <div class="container">
    <div class="card" aria-label="Sign up form">
      <h2>Create an account</h2>
      <form id="signup-form" autocomplete="off" novalidate>
        <!-- Account basics -->
        <fieldset aria-labelledby="account-fieldset">
          <legend id="account-fieldset" style="font-weight:600;">Account details</legend>

          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" placeholder="name@example.com" required>

          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" placeholder="Your password" required>

          <label for="signup-name">Display name (optional)</label>
          <input type="text" id="signup-name" name="display_name" placeholder="Your display name">
        </fieldset>

        <!-- Cardholder/user details (excluding Name on Card) -->
        <fieldset aria-labelledby="cardholder-fieldset">
          <legend id="cardholder-fieldset" style="font-weight:600;">Cardholder details</legend>

          <label for="full_legal_name">Legal name (as on government ID)</label>
          <input type="text" id="full_legal_name" name="full_legal_name" placeholder="Full legal name" required>

          <div class="row">
            <div>
              <label for="first_name">First name</label>
              <input type="text" id="first_name" name="first_name" placeholder="First name" required>
            </div>
            <div>
              <label for="last_name">Last name</label>
              <input type="text" id="last_name" name="last_name" placeholder="Last name" required>
            </div>
          </div>
        </fieldset>

        <!-- Billing address -->
        <fieldset aria-labelledby="billing-fieldset">
          <legend id="billing-fieldset" style="font-weight:600;">Billing address</legend>

          <div class="row">
            <div>
              <label for="billing_street">Street address</label>
              <input type="text" id="billing_street" name="billing_street" placeholder="Street address" required>
            </div>
            <div>
              <label for="billing_apartment">Apartment, unit, or other</label>
              <input type="text" id="billing_apartment" name="billing_apartment" placeholder="Apartment, unit, or other">
            </div>
          </div>

          <div class="row">
            <div>
              <label for="billing_city">City</label>
              <input type="text" id="billing_city" name="billing_city" placeholder="City" required>
            </div>
            <div>
              <label for="billing_state">State</label>
              <input type="text" id="billing_state" name="billing_state" placeholder="State" required>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="billing_zip">Zip code</label>
              <input type="text" id="billing_zip" name="billing_zip" placeholder="Zip code" required>
            </div>
            <div>
              <label for="billing_country">Country</label>
              <select id="billing_country" name="billing_country" required>
                <option value="US" selected>United States</option>
                <!-- Add other countries as needed -->
              </select>
            </div>
          </div>
        </fieldset>

        <!-- Contact information -->
        <fieldset aria-labelledby="contact-fieldset">
          <legend id="contact-fieldset" style="font-weight:600;">Contact information</legend>

          <label for="contact_email">Email (confirm)</label>
          <input type="email" id="contact_email" name="contact_email" placeholder="name@example.com" required>

          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
          <span class="note">By providing a phone number, you agree to receive informational SMS messages. Msg & data rates may apply.</span>
        </fieldset>

        <!-- Date of birth -->
        <fieldset aria-labelledby="dob-fieldset">
          <legend id="dob-fieldset" style="font-weight:600;">Date of birth</legend>

          <label for="date_of_birth">Date of birth</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required>
        </fieldset>

        <!-- Business identifier -->
        <fieldset aria-labelledby="business-fieldset">
          <legend id="business-fieldset" style="font-weight:600;">Business identifier</legend>

          <label for="business_id">Business ID</label>
          <input type="text" id="business_id" name="business_id" placeholder="Enter your business identifier" required>
        </fieldset>

        <button type="submit" id="signup-btn">Create account</button>
        <div class="status" id="signup-status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
  // Supabase config (keep keys safe; this uses anon key)
  const SUPABASE_URL = 'https://ziltrcaehpshkwganlcy.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_ANON-KEY';

  let supabase;

  function showBanner(text) {
    const b = document.getElementById('qp-banner');
    if (b) { b.style.display = 'block'; b.textContent = 'Init: ' + text; }
  }

  function initSupabase() {
    if (typeof supabase === 'undefined' || typeof supabase.createClient !== 'function') {
      console.warn('Supabase library not loaded yet.');
      showBanner('not ready');
      setTimeout(initSupabase, 150);
      return;
    }
    window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('Supabase initialized:', !!window.supabase);
    showBanner('ready');
    if (typeof window.bindSignupHandler === 'function') window.bindSignupHandler();
  }

  // Kick off init after CDN load
  setTimeout(initSupabase, 0);

  (function() {
    window.bindSignupHandler = async function() {
      const form = document.getElementById('signup-form');
      const status = document.getElementById('signup-status');
      const btn = document.getElementById('signup-btn');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!window.supabase) {
          alert('Please wait for initialization. Try again in a moment.');
          return;
        }

        // Basic validation
        const requiredIds = [
          'signup-email','signup-password','full_legal_name','first_name','last_name',
          'billing_street','billing_city','billing_state','billing_zip','billing_country',
          'contact_email','phone','date_of_birth','business_id'
        ];
        for (const id of requiredIds) {
          const el = document.getElementById(id);
          if (el && !el.value.trim()) {
            status.textContent = 'Please complete all required fields.';
            el.focus();
            return;
          }
        }

        // Build payload (note: no role field in form)
        const payload = {
          email: document.getElementById('signup-email').value.trim(),
          password: document.getElementById('signup-password').value,
          display_name: document.getElementById('signup-name').value.trim(),
          full_legal_name: document.getElementById('full_legal_name').value.trim(),
          first_name: document.getElementById('first_name').value.trim(),
          last_name: document.getElementById('last_name').value.trim(),
          billing_street: document.getElementById('billing_street').value.trim(),
          billing_apartment: document.getElementById('billing_apartment').value.trim(),
          billing_city: document.getElementById('billing_city').value.trim(),
          billing_state: document.getElementById('billing_state').value.trim(),
          billing_zip: document.getElementById('billing_zip').value.trim(),
          billing_country: document.getElementById('billing_country').value,
          contact_email: document.getElementById('contact_email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          date_of_birth: document.getElementById('date_of_birth').value,
          business_id: document.getElementById('business_id').value.trim()
        };

        // Determine default role server-side rule (admin if email domain matches)
        const email = payload.email;
        const isAdminEmail = /@uniquitysolutions\.com$/i.test(email);
        const defaultRole = isAdminEmail ? 'admin' : 'client'; // ROLE determined here for initial insert

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        status.textContent = '';

        try {
          // 1) Create auth user
          const { user, error: signUpError } = await window.supabase.auth.signUp(
            { email: payload.email, password: payload.password },
            {
              data: {
                display_name: payload.display_name,
                full_legal_name: payload.full_legal_name,
                first_name: payload.first_name,
                last_name: payload.last_name,
                date_of_birth: payload.date_of_birth
                // Do not include role here; role is set in users table
              }
            }
          );

          if (signUpError) {
            status.textContent = 'Signup error: ' + signUpError.message;
            btn.disabled = false;
            btn.textContent = 'Create account';
            return;
          }

          if (user && user.id) {
            // 2) Insert into users table with inferred role
            const { data: inserted, error: insertError } = await window.supabase
              .from('users')
              .insert([{
                id: user.id,
                email: payload.email,
                display_name: payload.display_name,
                full_legal_name: payload.full_legal_name,
                first_name: payload.first_name,
                last_name: payload.last_name,
                billing_street: payload.billing_street,
                billing_apartment: payload.billing_apartment,
                billing_city: payload.billing_city,
                billing_state: payload.billing_state,
                billing_zip: payload.billing_zip,
                billing_country: payload.billing_country,
                contact_email: payload.contact_email,
                phone: payload.phone,
                date_of_birth: payload.date_of_birth,
                business_id: payload.business_id,
                role: defaultRole // admin or client determined by email domain
              }]).single();

            if (insertError) {
              status.textContent = 'User record creation failed: ' + insertError.message;
              // Optional: rollback auth signup if needed
            } else {
              status.textContent = 'Signup successful. Please verify your email.';
              // You can redirect or show next steps here
            }
          } else {
            status.textContent = 'Signup succeeded, but no user record linked.';
          }
        } catch (err) {
          status.textContent = 'Signup failed: ' + (err?.message || err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Create account';
        }
      });
    };

    window.addEventListener('load', () => {
      if (typeof window.bindSignupHandler === 'function') window.bindSignupHandler();
    });
  })();
  </script>
</body>
</html>
